# reShapr stack pinned to release 1.1.0.
# Copied from the compose file generated by `reshapr run --release 1.1.0`, with
# the host data volume removed so every run starts from an empty database.
# All credentials below are upstream local-only demo defaults.
name: reshapr-poc
services:
  postgres:
    image: library/postgres:17-alpine
    container_name: reshapr-postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "54321:5432"
    environment:
      - POSTGRES_USER=reshapr
      - POSTGRES_PASSWORD=reshapr
      - POSTGRES_DB=reshapr
      - PGDATA=/var/lib/postgresql/data/pgdata

  control-plane:
    image: registry.reshapr.io/reshapr/reshapr-ctrl:1.1.0
    container_name: reshapr-control-plane
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    restart: on-failure
    ports:
      - "5555:5555"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/reshapr
      - QUARKUS_DATASOURCE_USERNAME=reshapr
      - QUARKUS_DATASOURCE_PASSWORD=reshapr
      - RESHAPR_ADMIN_NAME=admin
      - RESHAPR_ADMIN_PASSWORD=password
      - RESHAPR_ADMIN_EMAIL=reshapr@example.com
      - RESHAPR_DEFAULT_GATEWAY_TOKENS=my-super-secret-token-xyz
      - RESHAPR_ENCRYPTION_KEYS_V1=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      - RESHAPR_ENCRYPTION_ACTIVE_KEY_ID=v1
      - RESHAPR_ENCRYPTION_KEY=my-super-secret-key-32-char-long
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5555/q/health/ready" ]
      start_period: 5s
      interval: 5s
      timeout: 2s
      retries: 3

  gateway-01:
    image: registry.reshapr.io/reshapr/reshapr-proxy:1.1.0
    container_name: reshapr-gateway-01
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      control-plane:
        condition: service_healthy
    restart: on-failure
    ports:
      - "7777:7777"
    environment:
      - RESHAPR_CTRL_HOST=control-plane
      - RESHAPR_CTRL_PORT=5555
      - RESHAPR_CTRL_TOKEN=reshapr-my-super-secret-token-xyz
      - QUARKUS_OTEL_SDK_DISABLED=true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7777/q/health/ready" ]
      start_period: 5s
      interval: 5s
      timeout: 2s
      retries: 3
