name: microcks-poc
# Default PoC stack: Microcks "uber" distribution (all-in-one, embedded MongoDB-compatible
# store, authentication disabled) + its async minion + an MQTT broker.
# Native images (fast start, small footprint), pinned by digest to the 1.16.0-rc1 release
# candidate, which contains the fixes for microcks/microcks#2374 (gRPC) and #2375 (MQTT tests)
# that 1.15.0-native lacks. Release tags are expected to be retained, unlike nightly digests
# (the nightly pins of 2026-10-20 and 2026-10-22 both disappeared within 9-16 days).
# This is an interim pin: use 1.16.0 here once it is released.
# The native image has no curl/sh, so there is no container healthcheck; the PoC scripts
# wait for http://localhost:8080/api/keycloak/config themselves.
# For the released JVM images (1.15.0) add: -f microcks/docker-compose.jvm.yml
# State is in-memory: restarting the app container resets it.
# For the multi-component, Keycloak-secured stack see full/docker-compose.yml.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: microcks-poc-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - "./mosquitto.conf:/mosquitto/config/mosquitto.conf"

  app:
    image: quay.io/microcks/microcks-uber:1.16.0-rc1-native@sha256:eb61d6a1068ce59c7ee128ea5ad365419fbda88ffb28daff359afe7e92d9c3cb
    container_name: microcks-poc-app
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - TEST_CALLBACK_URL=http://app:8080
      - ASYNC_MINION_URL=http://async-minion:8081

  async-minion:
    image: quay.io/microcks/microcks-uber-async-minion:1.16.0-rc1-native@sha256:38920eb6b09b1fe74cf11510b4a27f435563bb26f9184b3d72aa1091954952e0
    container_name: microcks-poc-async-minion
    restart: on-failure
    depends_on:
      app:
        condition: service_started
      mosquitto:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      - MICROCKS_HOST_PORT=app:8080
      - ASYNC_PROTOCOLS=,MQTT
      - MQTT_SERVER=mosquitto:1883
