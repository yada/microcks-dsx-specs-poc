name: microcks-poc
services:
  mongo:
    image: mongo:4.4.29
    container_name: microcks-poc-db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 1s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: microcks-poc-sso
    ports:
      - "18080:8080"
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
    volumes:
      - "./keycloak-realm/microcks-realm-sample.json:/opt/keycloak/data/import/microcks-realm.json"
    command: ["start-dev", "--hostname=http://localhost:18080", "--import-realm", "--health-enabled=true"]
    healthcheck:
      test: ["CMD", "sh", "-c", "echo -e 'GET /health/live HTTP/1.1\r\nHost: localhost\r\n\r\n' > /dev/tcp/localhost/9000"]
      start_period: 10s
      interval: 10s
      timeout: 2s
      retries: 3

  postman:
    image: quay.io/microcks/microcks-postman-runtime:0.8.0
    container_name: microcks-poc-postman-runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      start_period: 5s
      interval: 20s
      timeout: 3s
      retries: 3

  zookeeper:
    image: quay.io/strimzi/kafka:0.43.0-kafka-3.8.0
    container_name: microcks-poc-zookeeper
    command: ["sh", "-c", "bin/zookeeper-server-start.sh config/zookeeper.properties"]
    environment:
      LOG_DIR: /tmp/logs
    healthcheck:
      test: nc -z localhost 2181 || exit -1
      interval: 10s
      timeout: 5s
      retries: 3

  kafka:
    depends_on:
      - zookeeper
    image: quay.io/strimzi/kafka:0.43.0-kafka-3.8.0
    container_name: microcks-poc-kafka
    command: [
      "sh", "-c",
      "bin/kafka-server-start.sh config/server.properties --override listeners=$${KAFKA_LISTENERS} --override advertised.listeners=$${KAFKA_ADVERTISED_LISTENERS} --override listener.security.protocol.map=$${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP} --override zookeeper.connect=$${KAFKA_ZOOKEEPER_CONNECT}"
    ]
    environment:
      LOG_DIR: "/tmp/logs"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/19092'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: microcks-poc-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - "../mosquitto.conf:/mosquitto/config/mosquitto.conf"

  app:
    depends_on:
      - mongo
      - keycloak
      - postman
      - kafka
    image: quay.io/microcks/microcks:1.15.0
    container_name: microcks-poc-app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/keycloak/config"]
      start_period: 15s
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - "./config:/deployments/config"
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_MONGODB_URI=mongodb://mongo:27017
      - SPRING_MONGODB_DATABASE=microcks
      - POSTMAN_RUNNER_URL=http://postman:3000
      - TEST_CALLBACK_URL=http://microcks-poc-app:8080
      - SERVICES_UPDATE_INTERVAL=0 0 0/2 * * *
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_PUBLIC_URL=http://localhost:18080
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:18080/realms/microcks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/microcks/protocol/openid-connect/certs
      - ASYNC_MINION_URL=http://async-minion:8081
      - KAFKA_BOOTSTRAP_SERVER=kafka:19092

  async-minion:
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8081:8081"
    image: quay.io/microcks/microcks-async-minion:1.15.0
    container_name: microcks-poc-async-minion
    restart: on-failure
    volumes:
      - "./config:/deployments/config"
    environment:
      - QUARKUS_PROFILE=docker-compose
      - JAVA_TOOL_OPTIONS=--add-opens=java.base/java.lang=ALL-UNNAMED
