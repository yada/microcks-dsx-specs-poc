# Async mocking support.
async-api.enabled=true

# Access to Microcks API server.
%docker-compose.io.github.microcks.minion.async.client.MicrocksAPIConnector/mp-rest/url=http://app:8080

# Access to Keycloak through docker network
%docker-compose.keycloak.auth.url=http://keycloak:8080

# Access to Kafka broker (internal control channel between app and minion).
%docker-compose.kafka.bootstrap.servers=kafka:19092

# Do not save any consumer-offset on the broker as there's a re-sync on each minion startup.
%docker-compose.mp.messaging.incoming.microcks-services-updates.enable.auto.commit=false
%docker-compose.mp.messaging.incoming.microcks-services-updates.bootstrap.servers=kafka:19092

# Do not save any consumer-offset on the broker as this is fire and forget consumption of events.
%docker-compose.mp.messaging.incoming.microcks-asyncapi-triggers.enable.auto.commit=false
%docker-compose.mp.messaging.incoming.microcks-asyncapi-triggers.bootstrap.servers=kafka:19092

# PoC: enable MQTT mock publishing (this is the actual dsx-exchange/bms.yaml binding), in addition to KAFKA/WS.
%docker-compose.minion.supported-bindings=KAFKA,WS,MQTT

%docker-compose.mqtt.server=mosquitto:1883
